openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: responsible-ai
    description: Conversation, answer analysis, and settings operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /conversations:
    get:
      operationId: listConversations
      tags: [responsible-ai]
      summary: List this session's conversations
      responses:
        "200":
          description: Conversations ordered by recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [responsible-ai]
      summary: Create a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /conversations/history:
    delete:
      operationId: clearConversationHistory
      tags: [responsible-ai]
      summary: Delete all conversations for this session
      responses:
        "200":
          description: Number of deleted conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteHistoryResult"
  /conversations/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getConversation
      tags: [responsible-ai]
      summary: Get a conversation and its messages
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "404":
          description: Conversation not found
    patch:
      operationId: renameConversation
      tags: [responsible-ai]
      summary: Rename a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationPatch"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
    delete:
      operationId: deleteConversation
      tags: [responsible-ai]
      summary: Delete a conversation
      responses:
        "200":
          description: Conversation deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
  /conversations/{conversationId}/messages:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: sendMessage
      tags: [responsible-ai]
      summary: Generate and analyze an answer to a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: User question, original answer, evidence analysis, and responsible revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: Invalid input
        "503":
          description: Gemini or evidence retrieval is unavailable
  /conversations/{conversationId}/regenerate:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: regenerateAnswer
      tags: [responsible-ai]
      summary: Regenerate an answer for an existing question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateInput"
      responses:
        "200":
          description: New answer and analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "404":
          description: Question not found
  /dashboard:
    get:
      operationId: getDashboard
      tags: [responsible-ai]
      summary: Get statistics calculated from this session's stored messages
      responses:
        "200":
          description: Actual conversation and analysis counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
  /settings:
    get:
      operationId: getSettings
      tags: [responsible-ai]
      summary: Get provider and evidence-service configuration status
      responses:
        "200":
          description: Safe configuration status without secret values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ConversationInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 120
      required: [title]
    ConversationPatch:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
      required: [title]
    Conversation:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, title, createdAt, updatedAt]
    ConversationDetail:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/ChatMessage"
          required: [messages]
    ChatMessageInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 10000
      required: [content]
    RegenerateInput:
      type: object
      properties:
        questionId: { type: string }
      required: [questionId]
    ChatMessage:
      type: object
      properties:
        id: { type: string }
        role:
          type: string
          enum: [user, assistant]
        content: { type: string }
        createdAt: { type: string, format: date-time }
        analysis:
          anyOf:
            - $ref: "#/components/schemas/AnswerAnalysis"
            - type: "null"
      required: [id, role, content, createdAt, analysis]
    AnalysisResult:
      type: object
      properties:
        question:
          $ref: "#/components/schemas/ChatMessage"
        answer:
          $ref: "#/components/schemas/ChatMessage"
      required: [question, answer]
    AnswerAnalysis:
      type: object
      properties:
        claims:
          type: array
          items:
            $ref: "#/components/schemas/ClaimCheck"
        bias:
          $ref: "#/components/schemas/BiasAnalysis"
        revisedAnswer:
          type: ["string", "null"]
        changeExplanation:
          type: ["string", "null"]
        warnings:
          type: array
          items: { type: string }
        verificationAvailable: { type: boolean }
      required: [claims, bias, revisedAnswer, changeExplanation, warnings, verificationAvailable]
    ClaimCheck:
      type: object
      properties:
        claim: { type: string }
        status:
          type: string
          enum: [SUPPORTED, CONTRADICTED, INSUFFICIENT_EVIDENCE]
        explanation: { type: string }
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceSource"
      required: [claim, status, explanation, evidence]
    EvidenceSource:
      type: object
      properties:
        title: { type: string }
        url: { type: string, format: uri }
        excerpt: { type: string }
      required: [title, url, excerpt]
    BiasAnalysis:
      type: object
      properties:
        detected: { type: boolean }
        concerns:
          type: array
          items:
            $ref: "#/components/schemas/BiasConcern"
        explanation: { type: string }
      required: [detected, concerns, explanation]
    BiasConcern:
      type: object
      properties:
        text: { type: string }
        type: { type: string }
        explanation: { type: string }
      required: [text, type, explanation]
    DashboardStats:
      type: object
      properties:
        totalQuestions: { type: integer }
        analyzedResponses: { type: integer }
        potentialHallucinations: { type: integer }
        potentialBiasIssues: { type: integer }
        revisedResponses: { type: integer }
      required: [totalQuestions, analyzedResponses, potentialHallucinations, potentialBiasIssues, revisedResponses]
    SettingsStatus:
      type: object
      properties:
        provider: { type: string }
        model: { type: string }
        geminiConfigured: { type: boolean }
        evidenceSearchProvider: { type: string }
        evidenceSearchAvailable: { type: boolean }
        requiredEnvironmentVariables:
          type: array
          items: { type: string }
      required: [provider, model, geminiConfigured, evidenceSearchProvider, evidenceSearchAvailable, requiredEnvironmentVariables]
    DeleteResult:
      type: object
      properties:
        deleted: { type: boolean }
      required: [deleted]
    DeleteHistoryResult:
      type: object
      properties:
        deletedCount: { type: integer }
      required: [deletedCount]

